<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Pencil and arrow — placements</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&family=Caveat:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .frame { margin: 0; }
  .frame + .frame { border-top: 1px solid var(--line); }

  .frame figcaption {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 20px;
    padding: 0 var(--gutter) clamp(34px, 5vh, 56px);
    margin-top: -0.2em;
    font-size: 13.5px;
    letter-spacing: 0.005em;
    color: var(--ink-faint);
  }

  .frame figcaption b { font-weight: 500; color: var(--ink-soft); }

  .replay {
    flex: none;
    padding: 0;
    border: 0;
    background: none;
    font: inherit;
    color: var(--ink-faint);
    cursor: pointer;
    transition: color 0.2s var(--ease);
  }
  .replay:hover { color: var(--ink); }

  .hero { position: relative; }

  /* ---------- the mark ---------- */

  .mark {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 12px;
    font-family: "Caveat", cursive;
    font-weight: 600;
    color: var(--ink-faint);
    line-height: 1;
    width: max-content;
  }

  .mark__name {
    display: block;
    white-space: nowrap;
    transform: rotate(-1.3deg);
    transform-origin: 0 80%;
  }

  /* education, always a quiet footnote */
  .edu {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-family: var(--font);
    font-size: 12.5px;
    line-height: 1;
    letter-spacing: 0.004em;
    color: var(--ink-faint);
    white-space: nowrap;
  }

  .edu img {
    width: 17px;
    height: 18px;
    object-fit: contain;
    opacity: 0.8;
  }

  /* ---------- the arrow ----------
     Geometry is measured in JS: it leaves the last letter of the name
     horizontally, bends once, and lands on the rim of whatever it is
     meant to point at, with the head aimed at that object's centre. */

  .mark__arrow {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
    pointer-events: none;
    color: var(--ink-faint);
  }

  .mark__arrow path {
    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
  }

  .mark__arrow .echo { stroke-opacity: 0.32; }

  .frame.is-in .mark__arrow .line { animation: draw 0.95s var(--ease-out) 0.25s forwards; }
  .frame.is-in .mark__arrow .echo { animation: draw 0.95s var(--ease-out) 0.33s forwards; }
  .frame.is-in .mark__arrow .head { animation: draw 0.28s var(--ease-out) 1.08s forwards; }

  @keyframes draw { to { stroke-dashoffset: 0; } }

  /* ---------- A · eyebrow ---------- */

  .v--a .mark {
    font-size: clamp(26px, 2.7vw, 40px);
    margin-bottom: clamp(18px, 3.4vh, 34px);
  }

  .v--a-plain .mark {
    font-size: clamp(26px, 2.7vw, 40px);
    margin-bottom: clamp(9px, 1.5vh, 16px);
  }

  /* ---------- B · signature ---------- */

  .v--b .mark {
    font-size: clamp(30px, 3.1vw, 46px);
    margin-top: clamp(22px, 3.4vh, 40px);
  }

  .v--b-plain .mark {
    font-size: clamp(30px, 3.1vw, 46px);
    margin-top: clamp(16px, 2.4vh, 28px);
  }

  @media (prefers-reduced-motion: reduce) {
    .mark__arrow path { stroke-dashoffset: 0; animation: none !important; }
    .hero__line { animation: none; }
  }

  @media (max-width: 720px) {
    .frame figcaption { flex-direction: column; align-items: flex-start; gap: 6px; }
    .v--a .mark { margin-bottom: 14px; }
  }
</style>
</head>
<body>
<div class="page">
<main>

  <figure class="frame v--a">
    <section class="hero">
      <div class="mark" aria-label="Hi, I’m Abhinav Prabhakar">
        <span class="mark__name">Hi, I’m Abhinav Prabhakar</span>
        <span class="edu"><img src="assets/img/jntuh.png" alt="" width="303" height="318">Studied at JNTUH, CSE AI/ML</span>
      </div>
      <h1 class="hero__title" aria-label="Making the world a better place, one ladder at a time.">
        <span class="hero__line">Making the <span class="emoji emoji--globe" aria-hidden="true"><img src="assets/emoji/globe-americas.webp" alt="" width="160" height="160"></span></span>
        <span class="hero__line">a better place,</span>
        <span class="hero__line">one <span class="emoji emoji--ladder" aria-hidden="true"><img src="assets/emoji/ladder.webp" alt="" width="160" height="160"></span> at a time.</span>
      </h1>
      <svg class="mark__arrow" data-arrow=".emoji--globe img" data-pad="9" data-swing="0.5" aria-hidden="true">
        <path class="line" pathLength="1" />
        <path class="echo" pathLength="1" />
        <path class="head" pathLength="1" />
      </svg>
    </section>
    <figcaption>
      <span><b>A — Eyebrow, with the arrow.</b> Leaves the end of the name, bends once, lands on the globe.</span>
      <button class="replay" type="button">Replay</button>
    </figcaption>
  </figure>

  <figure class="frame v--a-plain">
    <section class="hero">
      <div class="mark" aria-label="Hi, I’m Abhinav Prabhakar">
        <span class="mark__name">Hi, I’m Abhinav Prabhakar</span>
        <span class="edu"><img src="assets/img/jntuh.png" alt="" width="303" height="318">Studied at JNTUH, CSE AI/ML</span>
      </div>
      <h1 class="hero__title" aria-label="Making the world a better place, one ladder at a time.">
        <span class="hero__line">Making the <span class="emoji emoji--globe" aria-hidden="true"><img src="assets/emoji/globe-americas.webp" alt="" width="160" height="160"></span></span>
        <span class="hero__line">a better place,</span>
        <span class="hero__line">one <span class="emoji emoji--ladder" aria-hidden="true"><img src="assets/emoji/ladder.webp" alt="" width="160" height="160"></span> at a time.</span>
      </h1>
    </section>
    <figcaption>
      <span><b>A — Eyebrow, no arrow.</b> Same spot, tighter spacing. Quietest of the four.</span>
      <button class="replay" type="button">Replay</button>
    </figcaption>
  </figure>

  <figure class="frame v--b">
    <section class="hero">
      <h1 class="hero__title" aria-label="Making the world a better place, one ladder at a time.">
        <span class="hero__line">Making the <span class="emoji emoji--globe" aria-hidden="true"><img src="assets/emoji/globe-americas.webp" alt="" width="160" height="160"></span></span>
        <span class="hero__line">a better place,</span>
        <span class="hero__line">one <span class="emoji emoji--ladder" aria-hidden="true"><img src="assets/emoji/ladder.webp" alt="" width="160" height="160"></span> at a time<span class="dot">.</span></span>
      </h1>
      <div class="mark" aria-label="Hi, I’m Abhinav Prabhakar">
        <span class="mark__name">Hi, I’m Abhinav Prabhakar</span>
        <span class="edu"><img src="assets/img/jntuh.png" alt="" width="303" height="318">Studied at JNTUH, CSE AI/ML</span>
      </div>
      <svg class="mark__arrow" data-arrow=".dot" data-aim="under" data-pad="10" data-swing="0.46" aria-hidden="true">
        <path class="line" pathLength="1" />
        <path class="echo" pathLength="1" />
        <path class="head" pathLength="1" />
      </svg>
    </section>
    <figcaption>
      <span><b>B — Signature, with the arrow.</b> Signs underneath and points back up at the full stop.</span>
      <button class="replay" type="button">Replay</button>
    </figcaption>
  </figure>

  <figure class="frame v--b-plain">
    <section class="hero">
      <h1 class="hero__title" aria-label="Making the world a better place, one ladder at a time.">
        <span class="hero__line">Making the <span class="emoji emoji--globe" aria-hidden="true"><img src="assets/emoji/globe-americas.webp" alt="" width="160" height="160"></span></span>
        <span class="hero__line">a better place,</span>
        <span class="hero__line">one <span class="emoji emoji--ladder" aria-hidden="true"><img src="assets/emoji/ladder.webp" alt="" width="160" height="160"></span> at a time.</span>
      </h1>
      <div class="mark" aria-label="Hi, I’m Abhinav Prabhakar">
        <span class="mark__name">Hi, I’m Abhinav Prabhakar</span>
        <span class="edu"><img src="assets/img/jntuh.png" alt="" width="303" height="318">Studied at JNTUH, CSE AI/ML</span>
      </div>
    </section>
    <figcaption>
      <span><b>B — Signature, no arrow.</b> Just a signature under the line.</span>
      <button class="replay" type="button">Replay</button>
    </figcaption>
  </figure>

</main>
</div>

<script>
(() => {
  const f = (n) => Math.round(n * 10) / 10;
  const unit = (x, y) => {
    const l = Math.hypot(x, y) || 1;
    return [x / l, y / l];
  };

  const arrows = [...document.querySelectorAll("[data-arrow]")].map((svg) => {
    const hero = svg.closest(".hero");
    return {
      svg,
      hero,
      name: hero.querySelector(".mark__name"),
      target: hero.querySelector(svg.dataset.arrow),
      aim: svg.dataset.aim || "rim",
      pad: parseFloat(svg.dataset.pad || "10"),
      swing: parseFloat(svg.dataset.swing || "0.46"),
      sag: parseFloat(svg.dataset.sag || "0"),
      paths: {
        line: svg.querySelector(".line"),
        echo: svg.querySelector(".echo"),
        head: svg.querySelector(".head"),
      },
    };
  });

  function layout() {
    for (const a of arrows) {
      if (!a.target || !a.name) continue;

      const hb = a.hero.getBoundingClientRect();
      const nb = a.name.getBoundingClientRect();
      const tb = a.target.getBoundingClientRect();
      if (hb.width < 2 || tb.width < 2) continue;

      a.svg.setAttribute("viewBox", `0 0 ${f(hb.width)} ${f(hb.height)}`);

      /* leave the last letter just past its edge, at roughly mid-height */
      const sx = nb.right - hb.left + 12;
      const sy = nb.top - hb.top + nb.height * 0.55;

      const cx = tb.left - hb.left + tb.width / 2;
      const cy = tb.top - hb.top + tb.height / 2;

      let ex, ey, uix, uiy;

      if (a.aim === "under") {
        /* come up from beneath the mark and point straight at it, so the
           line never crosses the words above it. The mark's box is the
           em square, so the ink sits around four-fifths down. */
        const ink = tb.top - hb.top + tb.height * 0.78;
        ex = cx + 3;
        ey = ink + a.pad;
        [uix, uiy] = unit(-0.28, -1);
      } else {
        /* land on the rim wherever the name happens to sit, aimed at the
           centre of the thing */
        const r = Math.min(tb.width, tb.height) / 2 + a.pad;
        [uix, uiy] = unit(cx - sx, cy - sy);
        ex = cx - uix * r;
        ey = cy - uiy * r;
      }

      const dist = Math.hypot(ex - sx, ey - sy);

      /* no room to draw anything sensible — leave the name alone */
      if (dist < 44) {
        a.svg.style.display = "none";
        continue;
      }
      a.svg.style.display = "";

      const c1x = sx + (ex - sx) * a.swing;
      const c1y = sy + a.sag;

      /* approach from behind along the incoming direction, so the head aims */
      const m = dist * 0.42;
      const c2x = ex - uix * m;
      const c2y = ey - uiy * m;

      a.paths.line.setAttribute(
        "d",
        `M${f(sx)} ${f(sy)} C${f(c1x)} ${f(c1y)} ${f(c2x)} ${f(c2y)} ${f(ex)} ${f(ey)}`
      );

      /* a second, lighter pass a hair off the first: pencil, not vector */
      const tx = ex - uix * 4;
      const ty = ey - uiy * 4;
      a.paths.echo.setAttribute(
        "d",
        `M${f(sx + 0.7)} ${f(sy + 1.5)} C${f(c1x + 1.1)} ${f(c1y + 2)} ${f(c2x + 1.6)} ${f(c2y + 1.4)} ${f(tx)} ${f(ty)}`
      );

      /* two barbs, 13 long, 26° either side of the aim */
      const ang = Math.atan2(uiy, uix);
      const len = 13;
      const barb = (rot) => {
        const t = ang + rot;
        return [f(ex - Math.cos(t) * len), f(ey - Math.sin(t) * len)];
      };
      const [b1x, b1y] = barb(0.454);
      const [b2x, b2y] = barb(-0.454);
      a.paths.head.setAttribute(
        "d",
        `M${b1x} ${b1y} L${f(ex)} ${f(ey)} L${b2x} ${b2y}`
      );
    }
  }

  /* draw each arrow as its frame arrives */
  const frames = [...document.querySelectorAll(".frame")];
  const draw = (frame) => frame.classList.add("is-in");

  if ("IntersectionObserver" in window) {
    const io = new IntersectionObserver(
      (entries) => {
        for (const e of entries) {
          if (e.isIntersecting) {
            draw(e.target);
            io.unobserve(e.target);
          }
        }
      },
      { threshold: 0.35 }
    );
    frames.forEach((fr) => io.observe(fr));
  } else {
    frames.forEach(draw);
  }

  frames.forEach((frame) => {
    const btn = frame.querySelector(".replay");
    if (!btn) return;
    btn.addEventListener("click", () => {
      frame.classList.remove("is-in");
      void frame.offsetWidth;
      requestAnimationFrame(() => frame.classList.add("is-in"));
    });
  });

  layout();
  document.fonts?.ready.then(layout);

  let raf = 0;
  addEventListener(
    "resize",
    () => {
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(layout);
    },
    { passive: true }
  );
})();
</script>
</body>
</html>
