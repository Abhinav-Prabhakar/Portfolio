<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Making the world a better place, one ladder at a time.</title>
  <meta name="description" content="A developer portfolio. Making the world a better place, one ladder at a time.">
  <link rel="icon" href="assets/emoji/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&family=Caveat:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page">
    <main>

      <section class="hero">
        <div class="greeting">
          <p class="greeting__name">Hi, I’m Abhinav Prabhakar</p>
          <p class="greeting__edu"><img src="assets/img/jntuh.png" alt="" width="303" height="318">Studied at JNTUH, CSE AI/ML</p>
        </div>
        <h1 class="hero__title" aria-label="Making the world a better place, one ladder at a time.">
          <span class="hero__line">Making the <span class="emoji emoji--globe" data-globe aria-hidden="true"><canvas class="emoji__canvas" data-globe-canvas width="320" height="320"></canvas><img src="assets/emoji/globe-americas.webp" alt="" width="160" height="160"></span></span>
          <span class="hero__line">a better place,</span>
          <span class="hero__line">one <span class="emoji emoji--ladder" data-ladder aria-hidden="true"><img src="assets/emoji/ladder.webp" alt="" width="160" height="160"></span> at a time.</span>
        </h1>
      </section>

      <section class="work" aria-labelledby="work-heading">
        <div class="work__head">
          <h2 class="work__title" id="work-heading">Selected work</h2>
          <p class="work__count" data-count>47 projects</p>
        </div>
        <p class="work__lede">Every project with a screenshot, in one drifting sheet. Hover a tile to play the ones that move.</p>

        <div class="sheet" data-sheet>
          <div class="lane" data-lane></div>
          <div class="lane" data-lane></div>
          <div class="lane" data-lane></div>
        </div>
      </section>

      <footer class="footer">
        <p class="footer__note">&copy; 2026 Abhinav Prabhakar</p>
        <a class="footer__link" href="https://github.com/Abhinav-Prabhakar" target="_blank" rel="noopener">
          GitHub
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4.5 11.5 11.5 4.5M6 4.5h5.5V10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
      </footer>

    </main>
  </div>
  <script src="js/main.js" defer></script>
  <script src="js/work.js" defer></script>
</body>
</html>
